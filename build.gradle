plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.savanna'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('importContestKorea', JavaExec) {
	group = 'application'
	description = 'Import ContestKorea notices into the configured database, verify the list API, then exit.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.savanna.backend.integration.contestkorea.ContestKoreaImportCommand'
	workingDir = projectDir
	args "--contest-korea.import.category=${providers.gradleProperty('contestKoreaCategory').getOrElse('IDEA')}"
	args "--contest-korea.import.backup-only=${providers.gradleProperty('contestKoreaBackupOnly').getOrElse('false')}"
	args "--contest-korea.import.migrate-fields=${providers.gradleProperty('contestKoreaMigrate').getOrElse('false')}"
	if (providers.gradleProperty('contestKoreaCsv').isPresent()) {
		args "--contest-korea.import.csv=${providers.gradleProperty('contestKoreaCsv').get()}"
	}
}
