spring:
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: jdbc:h2:mem:savannadb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  sql:
    init:
      mode: never