# Activate with SPRING_PROFILES_ACTIVE=prod on the HTTPS backend.
app:
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://savanna-expedition.vercel.app,https://savanna-frontend.vercel.app}
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:https://savanna-expedition.vercel.app/login?google=success}
    failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:https://savanna-expedition.vercel.app/login?google=fail}

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:https://savanna-expedition.vercel.app/login/oauth2/code/google}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        path: /
        http-only: true
        secure: true
        same-site: Lax
        # No Domain: host-only at the browser-visible proxy host.
